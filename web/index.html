  <style>
    :root {
      --emerald: #126B4F;
      --deep: #064E3B;
      --gold: #C9A25E;
      --cream: #FCFAF6;
      --beige: #F5EFE3;
      --ink: #202923;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--cream);
      color: var(--ink);
    }

    #bitaqwa-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(circle at 50% 38%, rgba(18, 107, 79, 0.07), transparent 42%),
        var(--cream);
      transition: opacity 380ms ease;
      pointer-events: none;
    }

    #bitaqwa-splash .mark {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--deep), #0F7557);
      box-shadow: 0 18px 40px rgba(6, 78, 59, 0.24);
    }

    #bitaqwa-splash h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.8px;
      color: var(--ink);
    }

    #bitaqwa-splash p {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: #68746C;
    }

    #bitaqwa-splash .bar {
      width: 132px;
      height: 3px;
      margin-top: 8px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(18, 107, 79, 0.14);
    }

    #bitaqwa-splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: var(--gold);
      animation: bitaqwa-load 1400ms ease-in-out infinite;
    }

    @keyframes bitaqwa-load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #bitaqwa-splash .bar span { animation: none; width: 100%; }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #07130F; color: #EAF2EE; }
      #bitaqwa-splash {
        background:
          radial-gradient(circle at 50% 38%, rgba(159, 212, 188, 0.08), transparent 42%),
          #07130F;
      }
      #bitaqwa-splash h1 { color: #EAF2EE; }
      #bitaqwa-splash p { color: #99AEA3; }
    }

    .noscript {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div id="bitaqwa-splash" aria-hidden="true">
    <div class="mark">
      <svg width="44" height="44" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <g stroke="#FCFAF6" stroke-width="2.6" stroke-linejoin="round">
          <rect x="13" y="13" width="38" height="38" rx="7"/>
          <rect x="13" y="13" width="38" height="38" rx="7" transform="rotate(45 32 32)"/>
          <circle cx="32" cy="32" r="7"/>
        </g>
        <circle cx="32" cy="32" r="2.6" fill="#C9A25E"/>
      </svg>
    </div>
    <h1>Bitaqwa</h1>
    <p>Teman ibadah harian</p>
    <div class="bar"><span></span></div>
  </div>

  <noscript>
    <div class="noscript">
      <div>
        <h1>Bitaqwa memerlukan JavaScript</h1>
        <p>Aktifkan JavaScript di peramban untuk menggunakan jadwal shalat, Al-Qur'an, doa, zikir, dan arah kiblat.</p>
      </div>
    </div>
  </noscript>

  <script>
    (function () {
      var splash = document.getElementById('bitaqwa-splash');
      var removed = false;

      function hideSplash() {
        if (!splash || removed) return;
        removed = true;
        splash.style.opacity = '0';
        window.setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 420);
      }

      window.addEventListener('flutter-first-frame', hideSplash);
      // Safe fallback so the splash never traps the interface.
      window.setTimeout(hideSplash, 9000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
